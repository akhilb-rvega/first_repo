[project]
name = "verilog-eval"
version = "0.1.0"
description = "Verilog evaluation environment for RTL design tasks with synthesis checking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hud-python==0.5.12",
    "anthropic>=0.49.0",
    "click>=8.0.0",
    "defusedxml>=0.7.1",
    "mcp[cli]>1.21.1,<1.23",
    "numpy>=1.26.0",
    "packaging>=21.0",
    "pillow",
    "pydantic>=2.11.4",
    "pytest>=8.4.0",
    "google-genai>=1.58.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff==0.11.2", "pre-commit>=3.5.0"]

[project.scripts]
hud_eval = "cli:main"
setup_problem = "cli:setup_problem_script"
grade_problem = "cli:grade_problem_script"
validate_problem = "cli:validate_problem_script"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "B",  # flake8-bugbear
    "I",  # isort
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
