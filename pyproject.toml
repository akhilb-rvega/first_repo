[project]
name = "nv_nvdla_bdma_zero_detector"
version = "0.1.0"
description = "NVDLA BDMA Zero Detector Engine - Block-level sparsity detection for sparse compression"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cocotb>=1.8.0",
    "cocotb-tools>=1.0.0",
    "pytest>=7.0.0",
    "pytest-xdist>=3.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "B",  # flake8-bugbear
    "I",  # isort
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"